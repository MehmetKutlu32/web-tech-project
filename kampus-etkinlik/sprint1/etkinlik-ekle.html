<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri - Etkinlik Ekle</title>
</head>
<body>

    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-detay.html">Detay</a>
            <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
            <a href="etkinlik-guncelle.html">Etkinlik Güncelle</a>
        </nav>
    </header>

    <main>
        <form action="#" method="post">
            <p>
                <label for="etkinlik-adi">Etkinlik Adı</label><br>
                <input type="text" id="etkinlik-adi" name="etkinlik-adi" placeholder="Örn: Kariyer Günleri 2026" required>
            </p>

            <p>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="">-- Kategori Seçiniz --</option>
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="konferans">Konferans</option>
                    <option value="panel">Panel</option>
                    <option value="konser">Konser</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih / Saat</label><br>
                <input type="date" id="tarih" name="tarih" required>
                <input type="time" id="saat" name="saat" required>
            </p>

            <p>
                <label for="yer">Yer</label><br>
                <input type="text" id="yer" name="yer" placeholder="Örn: A Blok Konferans Salonu" required>
            </p>

            <p>
                <label for="kontenjan">Kontenjan</label><br>
                <input type="number" id="kontenjan" name="kontenjan" min="1" placeholder="Örn: 100" required>
            </p>

            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="5" cols="40" placeholder="Etkinliğin detayları, katılım koşulları..." required></textarea>
            </p>

            <p>
                <button type="submit">Kaydet</button>
            </p>
        </form>
    </main>

    <footer>
        <p>Mehmet Kutlu · 2416501002 · 2026</p>
    </footer>

</body>
</html>
